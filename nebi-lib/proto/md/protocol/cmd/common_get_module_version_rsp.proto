syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CommonGetModuleVersionRspData {
  optional uint32 ret_code = 1;
  optional uint32 sender = 2;
  optional uint32 receiver = 3;
  optional uint32 major_version = 4;
  optional uint32 minor_version = 5;
  bytes hardware_version = 6;
  bytes loader_version = 7;
  bytes firmware_version = 8;
  optional uint32 is_mass_product = 9;
}

message CommonGetModuleVersionRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CommonGetModuleVersionRspData data = 2;
}
