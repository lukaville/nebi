syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CommonAccessoryControlReqData {
  optional uint32 action = 1;
  optional uint32 receiver_type = 2;
  optional uint32 receiver_index = 3;
}

message CommonAccessoryControlReq {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CommonAccessoryControlReqData data = 2;
}
