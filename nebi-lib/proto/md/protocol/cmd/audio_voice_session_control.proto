syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message AudioVoiceSessionControlData {
  optional uint64 session_id = 1;
  optional uint32 control_seq = 2;
  optional uint32 state = 3;
  optional uint64 deadline_ns = 4;
}

message AudioVoiceSessionControl {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.AudioVoiceSessionControlData data = 2;
}
