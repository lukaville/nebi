[build-system]
requires = ["setuptools>=77"]   # PEP 639 license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "nebi-cli"
version = "0.2.0"
description = "Unofficial agent-friendly `nebi` CLI compatible with the Beni robot (LZ110/LZ100): JSON command client, agent runtime, local robot tools. Not affiliated with the manufacturer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]   # copies of the monorepo root files (PEP 639 forbids ../ paths)
authors = [{ name = "The nebi authors" }]
keywords = ["robot", "robotics", "beni", "lz110", "lz100", "cli", "agent", "llm", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: System :: Hardware",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "nebi-lib>=0.2.0,<0.3",
    "nebi-cockpit>=0.3.0,<0.4",  # the agent runs inside a cockpit app (the user's, or the standalone daemon)
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",    # `nebi tools say` (cockpit intercom)
    "numpy>=1.24",
    "pillow>=10.0.0",
]

# TODO(publish): add [project.urls] (Homepage / Source / Issues / Changelog) once the public repository exists.
# [project.urls]
# Source = "https://..."

[project.optional-dependencies]
# `nebi` pet tools: speech-to-text (Apple Silicon) and face recognition. `nebi say` works out of the box with the
# built-in chirp voice (and the OS's own speech via the built-in `system` engine); other TTS engines plug in through `nebi.tts` / the extension API.
pet = [
    "mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
nebi = "nebi_cli.cli:main"

# Every `nebi-cockpit serve` hosts the `nebi` agent API (/agent/*) when nebi-cli is installed.
[project.entry-points."nebi.extensions"]
nebi-cli = "nebi_cli.cockpit_ext:extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nebi_cli" = ["py.typed", "GUIDE.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

# ruff + mypy: shared monorepo config in ../pyproject.toml
