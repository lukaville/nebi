syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message NmWifiProvisionCommitRspData {
  optional uint32 result = 1;
  optional uint32 timeout_sec = 2;
  bytes resv = 3;
  optional uint32 total_timeout_sec = 4;
  bytes uuid = 5;
}

message NmWifiProvisionCommitRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.NmWifiProvisionCommitRspData data = 2;
}
