syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message RcFunctionKeyModeAckData {
  optional uint32 ret_code = 1;
  bytes reserved = 2;
}

message RcFunctionKeyModeAck {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.RcFunctionKeyModeAckData data = 2;
}
