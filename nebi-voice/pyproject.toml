[build-system]
requires = ["setuptools>=77"]   # PEP 639 license expression + license-files
build-backend = "setuptools.build_meta"

[project]
name = "nebi-voice"
version = "0.2.0"
description = "Small-robot text-to-speech on the tiny-voca ONNX model; a nebi TTS extension for robots compatible with Beni. Not affiliated with the manufacturer."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]   # copies of the monorepo root files (PEP 639 forbids ../ paths)
authors = [{ name = "The nebi authors" }]
keywords = ["tts", "text-to-speech", "robot", "robotics", "beni", "onnx", "voice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "onnxruntime>=1.18",
    "huggingface_hub>=0.24",
    "pyworld>=0.3.4",
]

# TODO(publish): add [project.urls] (Homepage / Source / Issues / Changelog) once the public repository exists.

[project.optional-dependencies]
# The nebi extension (`nebi_voice.extension`) only runs inside a nebi host (nebi-cli / nebi-cockpit), which
# already brings nebi-lib; this extra exists for installing the voice next to a bare nebi.
nebi = ["nebi-lib>=0.2.0,<0.3"]
play = ["sounddevice>=0.4"]
dev = ["nebi-voice[nebi]", "pytest>=8"]

[project.scripts]
nebi-voice = "nebi_voice.cli:main"

[project.entry-points."nebi.extensions"]
nebi-voice = "nebi_voice.extension:extension"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nebi_voice = ["web.html"]
"nebi_voice._vendor" = ["README.md"]
"nebi_voice._vendor.dizione" = ["LICENSE", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"   # silences pytest-asyncio from the shared venv

# ruff + mypy: shared monorepo config in ../pyproject.toml
