syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message SnapbackReadyData {
  bytes snapshot_id = 1;
  optional uint32 event_type = 2;
  optional uint64 occurred_at_ms = 3;
  bytes metadata = 4;
  optional uint64 capture_version = 5;
}

message SnapbackReady {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.status.SnapbackReadyData data = 2;
}
