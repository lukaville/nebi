syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message DeviceSecurityDeviceAttestRspData {
  optional uint32 ret_code = 1;
  optional uint32 cert_len = 2;
  bytes cert_der = 3;
  bytes signature = 4;
}

message DeviceSecurityDeviceAttestRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.DeviceSecurityDeviceAttestRspData data = 2;
}
