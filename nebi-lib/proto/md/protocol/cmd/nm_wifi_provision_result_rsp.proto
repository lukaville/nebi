syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message NmWifiProvisionResultRspData {
  optional uint32 result = 1;
  optional uint32 uuid_match = 2;
  optional uint32 state = 3;
  optional uint32 fail_reason = 4;
  bytes uuid = 5;
  optional uint32 ssid_len = 6;
  bytes ssid = 7;
  bytes ipv4 = 8;
  optional uint32 channel = 9;
  optional sint32 rssi = 10;
  bytes resv = 11;
}

message NmWifiProvisionResultRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.NmWifiProvisionResultRspData data = 2;
}
