syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message NmWifiSwitchToStationRspData {
  optional uint32 result = 1;
  optional uint32 current_mode = 2;
  bytes resv = 3;
}

message NmWifiSwitchToStationRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.NmWifiSwitchToStationRspData data = 2;
}
