syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message NmWifiProvisionResultReqData {
  bytes uuid = 1;
  bytes resv = 2;
}

message NmWifiProvisionResultReq {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.NmWifiProvisionResultReqData data = 2;
}
