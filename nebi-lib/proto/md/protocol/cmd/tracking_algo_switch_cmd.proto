syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message TrackingAlgoSwitchCmdData {
  optional uint32 model_version = 1;
  optional uint32 reserved_0 = 2;
  optional uint32 reserved_1 = 3;
  optional uint32 reserved_2 = 4;
}

message TrackingAlgoSwitchCmd {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.TrackingAlgoSwitchCmdData data = 2;
}
