syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message AudioPlayFileRspData {
  optional uint32 return_code = 1;
  optional uint32 session_id = 2;
  optional uint64 timestamp_ns = 3;
}

message AudioPlayFileRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.AudioPlayFileRspData data = 2;
}
