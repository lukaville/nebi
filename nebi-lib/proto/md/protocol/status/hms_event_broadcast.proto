syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message HmsEventBroadcastData {
  optional uint64 offset = 1;
  optional uint32 module_id = 2;
  optional uint32 fault_code = 3;
  optional uint32 instance_id = 4;
  optional uint32 kind = 5;
  optional uint32 severity = 6;
  optional uint64 timestamp_ms = 7;
  optional uint64 daemon_instance_id = 8;
  optional uint64 state_revision = 9;
  optional uint32 origin = 10;
  optional uint32 recovery_state = 11;
}

message HmsEventBroadcast {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.status.HmsEventBroadcastData data = 2;
}
