syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CommonGetPartitionSizeRspData {
  optional uint32 ret_code = 1;
  optional uint32 cmd_version = 2;
  optional uint32 part_type = 3;
  optional uint32 slot = 4;
  optional uint64 size_bytes = 5;
}

message CommonGetPartitionSizeRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CommonGetPartitionSizeRspData data = 2;
}
