syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";
import "md/protocol/common/camera_relative_trajectory_replay_descriptor.proto";

message CameraRelativeTrajectoryReplayCatalogQueryRspData {
  optional uint32 trajectory_count = 1;
  repeated .md.protocol.common.CameraRelativeTrajectoryReplayDescriptor descriptors = 7;
  optional uint32 catalog_format_version = 8;
  optional uint32 ret_code = 9;
}

message CameraRelativeTrajectoryReplayCatalogQueryRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CameraRelativeTrajectoryReplayCatalogQueryRspData data = 2;
}
