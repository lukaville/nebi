syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message TimeCorrectionReqData {
  optional uint64 timestamp = 1;
  optional uint32 offset = 2;
}

message TimeCorrectionReq {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.TimeCorrectionReqData data = 2;
}
