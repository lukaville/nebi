syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CommonGetCryptoInfoRspData {
  optional uint32 ret_code = 1;
  optional uint32 cmd_version = 2;
  optional uint32 is_encrypted = 3;
  bytes batch_id = 4;
  bytes reserved = 5;
}

message CommonGetCryptoInfoRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CommonGetCryptoInfoRspData data = 2;
}
