syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message RealRlControlRequestData {
  optional uint32 version = 1;
  optional uint32 inference_mode = 2;
  optional uint32 rollout_recording_requested = 3;
  optional uint32 recording_duration_ms = 4;
  optional uint64 client_session_id = 5;
  optional float exploration_scale = 6;
}

message RealRlControlRequest {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.RealRlControlRequestData data = 2;
}
