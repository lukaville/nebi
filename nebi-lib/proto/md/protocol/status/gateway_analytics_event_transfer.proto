syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message GatewayAnalyticsEventTransferData {
  bytes delivery_id = 1;
  optional uint64 occurred_at_ms = 2;
  bytes event_id = 3;
  bytes producer = 4;
  optional uint64 count = 5;
  optional uint32 attributes_json_len = 6;
  bytes attributes_json = 7;
}

message GatewayAnalyticsEventTransfer {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.status.GatewayAnalyticsEventTransferData data = 2;
}
