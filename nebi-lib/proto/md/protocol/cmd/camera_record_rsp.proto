syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CameraRecordRspData {
  optional uint32 action = 1;
  optional uint64 request_id = 2;
  optional uint32 ret_code = 3;
  optional uint32 state = 4;
}

message CameraRecordRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CameraRecordRspData data = 2;
}
