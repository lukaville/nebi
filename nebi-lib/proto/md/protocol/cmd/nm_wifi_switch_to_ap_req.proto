syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message NmWifiSwitchToApReqData {
  optional uint32 trigger_source = 1;
  bytes resv = 2;
}

message NmWifiSwitchToApReq {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.NmWifiSwitchToApReqData data = 2;
}
