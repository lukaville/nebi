syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message SchedulerStatusData {
  optional uint32 current_mode = 1;
  optional uint32 sub_mode = 2;
  optional uint32 request_source = 3;
  optional uint32 is_locked = 4;
  optional uint32 is_paused = 5;
  optional uint64 timestamp_ns = 6;
  bytes sub_mode_state = 7;
  optional uint32 ego_active = 8;
  optional uint32 obstacle_avoidance_flags = 9;
}

message SchedulerStatus {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.status.SchedulerStatusData data = 2;
}
