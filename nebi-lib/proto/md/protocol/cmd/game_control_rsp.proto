syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message GameControlRspData {
  optional uint32 ret_code = 1;
  optional uint32 sub_ret_code = 2;
  optional uint64 timestamp_ns = 3;
  optional uint32 game_type = 4;
  optional uint32 action = 5;
  optional uint32 session_id = 6;
}

message GameControlRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.GameControlRspData data = 2;
}
