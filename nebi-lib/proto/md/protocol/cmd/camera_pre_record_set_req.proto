syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CameraPreRecordSetReqData {
  optional uint32 enabled = 3;
  optional uint32 duration_s = 4;
}

message CameraPreRecordSetReq {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CameraPreRecordSetReqData data = 2;
}
