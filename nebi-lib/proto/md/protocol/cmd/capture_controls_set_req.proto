syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message CaptureControlsSetReqData {
  optional uint32 update_mask = 1;
  optional bool is_pro_mode = 2;
  optional uint32 shutter_mode = 3;
  optional uint64 shutter_ns = 4;
  optional uint32 iso_mode = 5;
  optional uint32 iso = 6;
  optional uint32 wb_mode = 7;
  optional uint32 wb_kelvin = 8;
  optional float ev_compensation = 9;
}

message CaptureControlsSetReq {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.CaptureControlsSetReqData data = 2;
}
