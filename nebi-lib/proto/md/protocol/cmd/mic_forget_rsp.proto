syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message MicForgetRspData {
  optional uint32 ret_code = 1;
  optional uint32 removed_count = 2;
}

message MicForgetRsp {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.MicForgetRspData data = 2;
}
