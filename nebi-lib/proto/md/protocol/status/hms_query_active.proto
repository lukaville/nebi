syntax = "proto3";
package md.protocol.status;
import "md/protocol/common/wire_header.proto";

message HmsQueryActiveData {
  optional uint32 filter_kind = 1;
  optional uint32 _pad0 = 2;
  optional uint32 module_id = 3;
  optional uint64 request_id = 4;
}

message HmsQueryActive {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.status.HmsQueryActiveData data = 2;
}
