syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";
import "md/protocol/common/ota_upgrade_task_context.proto";

message OtaUpgradeControlReqData {
  optional uint32 control_cmd = 1;
  optional uint32 version_field1 = 2;
  optional uint32 version_field2 = 3;
  optional uint32 reserved = 4;
  .md.protocol.common.OtaUpgradeTaskContext task = 5;
}

message OtaUpgradeControlReq {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.OtaUpgradeControlReqData data = 2;
}
