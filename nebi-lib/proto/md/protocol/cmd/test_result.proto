syntax = "proto3";
package md.protocol.cmd;
import "md/protocol/common/wire_header.proto";

message TestResultData {
  optional uint32 test_type = 1;
  optional uint32 result = 2;
  bytes reserved = 3;
  optional uint64 timestamp_ms = 4;
  bytes session_id = 5;
}

message TestResult {
  .md.protocol.common.WireHeader header = 1;
  .md.protocol.cmd.TestResultData data = 2;
}
